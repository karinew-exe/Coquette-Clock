<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:transparent;
    font-family:'Cormorant Garamond',serif;
}

.clock-widget{
    width:300px;
    background:#f8f4f6;
    border:2px solid #efc6d8;
    border-radius:28px;
    padding:14px;

    text-align:center;

    box-shadow:
    0 0 25px rgba(239,198,216,.35),
    inset 0 0 0 6px rgba(255,240,245,.7);
}

.decor{
    color:#b88aa3;
    font-size:.9rem;
}

#clock{
    color:#8f647c;
    font-size:2rem;
    font-weight:600;
    margin:8px 0;
}

.label{
    color:#b88aa3;
    font-size:.7rem;
    letter-spacing:1px;
}
</style>
</head>

<body>

<div class="clock-widget">
    <div class="decor">୨୧ ✧ ୨୧</div>
    <div id="clock"></div>
    <div class="label">♡ current time ♡</div>
</div>

<script>
function updateClock(){

    const now = new Date();

    const time = now.toLocaleTimeString([],{
        hour:'2-digit',
        minute:'2-digit',
        second:'2-digit'
    });

    document.getElementById('clock').textContent = time;
}

updateClock();
setInterval(updateClock,1000);
</script>

</body>
</html>
